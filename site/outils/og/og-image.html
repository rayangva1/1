<!DOCTYPE html>
<html lang="fr-CH" data-da="a" data-theme="light">
<head>
  <meta charset="utf-8">
  <!-- Gabarit de l'image de partage (1200 × 630) — rendu par site/outils/generer_og.py. Nom de travail NON VALIDÉ. -->
  <title>Image de partage — Quai des Cartes</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:opsz,wght@14..32,400..700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="../../landing/assets/da/tokens.css">
  <link rel="stylesheet" href="../../landing/assets/da/components.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    .og { position: relative; box-sizing: border-box; width: 1200px; height: 630px; padding: 64px 72px; background: var(--da-color-surface-alt); border-bottom: 18px solid var(--da-color-accent); display: grid; grid-template-columns: 1.35fr 1fr; align-items: center; }
    .og img { height: 46px; width: auto; display: block; margin-bottom: 44px; }
    .og h1 { font-size: 64px; margin: 0 0 28px; }
    .og p { margin: 0; font-size: 26px; font-weight: 600; color: var(--da-color-ink); }
    .forme { position: absolute; width: 230px; aspect-ratio: 5 / 7; border: 4px solid var(--da-color-ink); border-radius: 10px; background: var(--da-color-surface); }
    .f1 { right: 250px; top: 120px; transform: rotate(-8deg); }
    .f2 { right: 160px; top: 90px; transform: rotate(3deg); background: var(--da-color-accent); }
    .f3 { right: 70px; top: 135px; transform: rotate(10deg); background: var(--da-color-accent-soft); }
  </style>
</head>
<body class="da-root">
  <div class="og">
    <div>
      <img src="../../landing/assets/da/logo-horizontal.svg" alt="Quai des Cartes">
      <h1 class="da-title">Pokémon JCC en français, expédié depuis la Suisse.</h1>
      <p>Produits neufs et scellés · stock réel · livraison en Suisse</p>
    </div>
    <div aria-hidden="true"><span class="forme f1"></span><span class="forme f2"></span><span class="forme f3"></span></div>
  </div>
</body>
</html>
