  - id: "18-pre-drop-remboursement"
    nom: "Pré-drop : réservation remboursée intégralement (allocation réduite, non servie ou annulée)"
    canal: n8n
    categorie: transactionnel
    declencheur: "Remboursement pré-drop exécuté chez le prestataire de paiement et relevé au moteur (POST /predrop/refunds/{id}/executed, premier relevé)"
    segment: "Le client de la réservation remboursée"
    base: "Exécution du contrat (PRECOMMANDES : remboursement intégral, supplément compris)"
    frequence: "Une fois par remboursement"
    objet: "Réservation garantie remboursée : commande [[numero_commande]]"
    pre_entete: "Remboursement intégral, supplément compris, et son motif."
    # Revue pré-drop (PDL-12) : un seul paragraphe neutre, valable pour tous les motifs (réduction, non servie,
    # annulation, report…) ; le motif propre au client est la variable [[motif_remboursement]] du moteur.
    variables:
      - [salutation, "Salutation calculée par l'outil d'emailing", "Bonjour Léa,"]
      - [numero_commande, "Numéro de commande (lu par l'outil d'emailing depuis la commande Shopify)", "#1001 (FICTIF)"]
      - [montant_rembourse, "Montant remboursé du moteur (amount_ttc, CHF, 2 décimales : supplément et frais de livraison payés pour la réservation compris), jamais recalculé", "229.90 (FICTIF)"]
      - [motif_remboursement, "Motif en français du moteur (reason_fr), sans terme interne", "la quantité qui nous a été attribuée a été réduite et nous ne pourrons pas vous servir"]
      - [url_alerte_produit, "Formulaire d'alerte de la fiche normale (consentement demandé)", "https://exemple.invalid/products/display-extension-exemple-fr#alerte"]
    blocs:
      - titre: "Votre réservation est remboursée"
      - p: "[[salutation]]"
      - p: "Votre réservation garantie (commande [[numero_commande]]) est remboursée intégralement. Motif : [[motif_remboursement]]."
      - encadre:
          - "**Remboursement intégral, supplément compris** : CHF [[montant_rembourse]], frais de livraison payés pour la réservation inclus, sur votre moyen de paiement d'origine. Le crédit sur votre compte dépend ensuite de votre banque."
      - p: "Nos conditions de réservation garantie prévoient un remboursement intégral chaque fois qu'une réservation n'est pas servie ou est annulée."
      - p: "Les autres articles éventuels de votre commande ne sont pas concernés."
      - p: "Si vous le souhaitez, nous pouvons vous prévenir quand ce produit arrive en stock local :"
      - bouton: {texte: "Demander une alerte", url: "[[url_alerte_produit]]", style: secondaire}

