    canal: n8n
    categorie: transactionnel
    declencheur: "Nouvelle date de sortie reçue (événement « report » du catalogue)"
    segment: "Clients ayant une précommande ouverte sur ce produit"
    base: "Exécution du contrat (PRECOMMANDES : information du report)"
    frequence: "À chaque report"
    objet: "Report de sortie : [[produit_titre]]"
    pre_entete: "Nouvelle date annoncée et vos options."
    variables:
      - [salutation, "Salutation calculée par le workflow", "Bonjour Léa,"]
      - [numero_commande, "Numéro de commande", "#1001 (FICTIF)"]
      - [produit_titre, "Titre exact de la fiche", "Coffret — Extension Exemple 2 — FR (FICTIF)"]
      - [date_initiale, "Date annoncée lors de la commande", "6.11.2026"]
      - [nouvelle_date, "Nouvelle date annoncée", "20.11.2026"]
      - [date_information, "Date à laquelle l'information a été reçue", "2.11.2026"]
      - [texte_option_annulation, "Texte calculé par le workflow selon SEUIL_REPORT_PRECOMMANDE (deux textes possibles, voir README)", "Le report dépasse le délai prévu par nos conditions : vous pouvez annuler et obtenir un remboursement intégral. Répondez simplement à cet email."]
    blocs:
      - titre: "La date de sortie a changé"
      - p: "[[salutation]]"
      - p: "La sortie de [[produit_titre]] (commande [[numero_commande]]) est reportée. Nous vous transmettons l'information dès que nous la recevons."
      - faits:
          - ["Date annoncée lors de votre commande", "[[date_initiale]]"]
          - ["Nouvelle date annoncée", "[[nouvelle_date]]"]
          - ["Information reçue le", "[[date_information]]"]
      - p: "**Garder votre précommande** : vous n'avez rien à faire. Nous expédions dès réception."
      - p: "[[texte_option_annulation]]"
      - bouton: {texte: "Nos conditions de précommande", url: "{{URL_PRECOMMANDES}}", style: secondaire}

