# Source des emails — docs/06-contenu/EMAILS/
# Généré en HTML (styles en ligne, couleurs de la DA direction A) et en texte par :
#   python docs/06-contenu/outils/generer_emails.py
# Ne pas modifier les fichiers html/ et texte/ : modifier ce fichier puis régénérer.
#
# Syntaxe des textes :
#   [[variable]]   valeur fournie à l'envoi : n8n => {{ $json.variable }} ; Shopify (Liquid) => {{ variable }}
#                  (filtres Liquid autorisés pour Shopify : [[total_price | money]])
#   {{CHAMP}}      champ fixe du registre docs/04-legal/champs_a_remplir.yaml (ou URL_LOGO_PNG), rempli à l'intégration
#   **gras**  et  [texte](url)
# motif_pied (obligatoire pour la catégorie marketing) : motif d'envoi affiché dans le pied, conforme au segment :
#   alertes = inscrit aux alertes (lien de préférences) ; client = client avec consentement ou non opposé (C2) ;
#   checkout = consentement coché lors du passage en caisse (C4).
# Règles : aucune donnée interne (coût, marge, fournisseur, allocation chiffrée) ; aucun prix sauf prix public
# relu au moment de l'envoi ; aucune fausse urgence ; produits « stock local », « précommande » ou « réservation
# garantie » (pré-drop) seulement.
# Pré-drop (emails 15 à 19, décision de la propriétaire du 6.10.2026) : les deux phrases de garantie sont celles du
# moteur (engine/pokeshop/predrop.py : GUARANTEE_TEXT_FR, NO_DIFFERENCE_REFUND_FR), mot pour mot (contrôlé par les
# tests) ; ni prix, ni quantité, ni heure de fermeture, ni compte à rebours dans les variables.
# Tous les exemples sont FICTIFS.

version: "2026-10-04"
emails:
  - id: "01-confirmation-inscription"
    nom: "Confirmation d'inscription (double opt-in)"
    canal: n8n
    categorie: inscription
    declencheur: "Formulaire d'inscription reçu (landing ou formulaire Shopify), adresse non encore confirmée"
    segment: "La seule personne inscrite, statut en_attente"
    base: "Demande explicite de la personne ; email unique, sans contenu promotionnel"
    frequence: "Une fois par inscription ; pas de relance automatique"
    objet: "Confirmez votre alerte {{NOM_BOUTIQUE}}"
    pre_entete: "Un clic pour activer vos alertes. Sans confirmation, nous ne vous écrirons pas."
    variables:
      - [salutation, "« Bonjour Léa, » ou « Bonjour, » si le prénom est vide (calculé par le workflow)", "Bonjour Léa,"]
      - [url_confirmation, "Lien de confirmation à jeton unique", "https://n8n.exemple.invalid/webhook/alertes-confirmer?jeton=FICTIF"]
      - [duree_validite_lien, "Durée de validité du lien (hypothèse : 7 jours)", "7 jours"]
    blocs:
      - titre: "Confirmez votre inscription"
      - p: "[[salutation]]"
      - p: "Vous avez demandé à recevoir l'alerte d'ouverture de {{NOM_BOUTIQUE}} et, si vous l'avez choisi, nos alertes de stock et au plus un email récapitulatif par semaine."
      - bouton: {texte: "Confirmer mon inscription", url: "[[url_confirmation]]"}
      - p: "Ce lien est valable [[duree_validite_lien]]."
      - p: "Vous n'êtes pas à l'origine de cette demande ? Ignorez simplement cet email : sans clic de votre part, votre adresse n'est pas inscrite."

  - id: "02-bienvenue-preferences"
    nom: "Bienvenue et préférences"
    canal: n8n
    categorie: marketing
    motif_pied: alertes
    declencheur: "Clic sur le lien de confirmation"
    segment: "La personne qui vient de confirmer"
    base: "Consentement confirmé (double opt-in)"
    frequence: "Une fois"
    objet: "Vos alertes {{NOM_BOUTIQUE}} sont actives"
    pre_entete: "Ce que vous allez recevoir, et comment changer vos choix."
    variables:
      - [salutation, "Salutation calculée par le workflow", "Bonjour Léa,"]
      - [formats_choisis, "Libellés des formats cochés, ou « tous les formats » si aucun", "Coffrets Dresseur d'élite (ETB), Displays"]
      - [url_preferences, "Page de préférences à jeton", "https://n8n.exemple.invalid/webhook/alertes-preferences?jeton=FICTIF"]
      - [url_guide, "Guide S01 (ETB ou display)", "https://exemple.invalid/blogs/guides/etb-ou-display"]
      - [url_desinscription, "Désinscription en un clic", "https://n8n.exemple.invalid/webhook/alertes-desinscrire?jeton=FICTIF"]
      - [date_consentement, "Date de confirmation (jj.mm.aaaa)", "14.10.2026"]
    blocs:
      - titre: "Vos alertes sont actives"
      - p: "[[salutation]]"
      - p: "Merci d'avoir confirmé. Voici ce que vous recevrez :"
      - liste:
          - "l'alerte d'ouverture de la boutique, quand les produits sont reçus et contrôlés ;"
          - "les alertes de stock local pour : [[formats_choisis]] ;"
          - "au plus un email récapitulatif par semaine, seulement s'il y a quelque chose d'utile."
      - encadre:
          - "**Nos règles.** « Stock local » : le produit est chez nous, à Genève. « Précommande » : seulement quand la quantité nous est confirmée par écrit. Aucune fausse urgence, aucune promesse de carte rare ni de valeur."
      - bouton: {texte: "Modifier mes préférences", url: "[[url_preferences]]", style: secondaire}
      - p: "Pour commencer : [ETB ou display, lequel choisir ?]([[url_guide]])"

  - id: "03-ouverture-boutique"
    nom: "Ouverture douce (BL-118)"
    canal: n8n
    categorie: marketing
    motif_pied: alertes
    declencheur: "GO de l'ouverture douce (C14) : fiches publiées, stock local réel"
    segment: "Tous les inscrits confirmés"
    base: "Consentement confirmé (alerte d'ouverture)"
    frequence: "Une fois"
    objet: "{{NOM_BOUTIQUE}} est ouverte : ce qui est en stock local"
    pre_entete: "Produits reçus et contrôlés à Genève. Livraison en Suisse."
    variables:
      - [salutation, "Salutation calculée par le workflow", "Bonjour Léa,"]
      - [lignes_produits_html, "Lignes produits rendues avec les gabarits _ligne-produit-*.html (produits en stock local ou en précommande uniquement, prix relus sur la page publique)", "(voir l'aperçu)"]
      - [url_stock_local, "Collection « Disponible maintenant »", "https://exemple.invalid/collections/disponible-maintenant"]
      - [url_preferences, "Page de préférences", "https://n8n.exemple.invalid/webhook/alertes-preferences?jeton=FICTIF"]
      - [url_desinscription, "Désinscription en un clic", "https://n8n.exemple.invalid/webhook/alertes-desinscrire?jeton=FICTIF"]
      - [date_consentement, "Date de confirmation", "14.10.2026"]
    blocs:
      - titre: "La boutique est ouverte"
      - p: "[[salutation]]"
      - p: "Les produits sont arrivés à Genève et ont été contrôlés. Voici ce qui est en stock local aujourd'hui :"
      - lignes_produits: {variable: lignes_produits_html}
      - p: "Une limite par foyer, toutes commandes confondues, s'applique à certains produits ; elle figure sur chaque fiche. La disponibilité affichée sur le site au moment de votre commande fait foi."
      - bouton: {texte: "Voir le stock local", url: "[[url_stock_local]]"}
      - encadre:
          - "Livraison en Suisse uniquement · expédition sous {{DELAI_EXPEDITION}} · frais affichés avant le paiement."

  - id: "04-alerte-stock-local"
    nom: "Alerte : nouveau stock local"
    canal: n8n
    categorie: marketing
    motif_pied: alertes
    declencheur: "Entrée en stock local réelle (réception contrôlée, fiche publiée) d'un produit suivi"
    segment: "Inscrits confirmés : alerte sur ce produit, ou préférences correspondant au format"
    base: "Consentement confirmé (alertes de stock choisies)"
    frequence: "Au plus une alerte par produit et par personne ; pas d'envoi si le stock repasse à zéro avant l'envoi"
    objet: "En stock local : [[produit_titre]]"
    pre_entete: "Le produit que vous suivez est arrivé à Genève."
    variables:
      - [salutation, "Salutation calculée par le workflow", "Bonjour Léa,"]
      - [raison_alerte, "« Vous avez demandé une alerte pour ce produit. » ou « Ce produit correspond aux formats que vous suivez. »", "Vous avez demandé une alerte pour ce produit."]
      - [produit_titre, "Titre exact de la fiche (format + extension + langue)", "Display 36 boosters — Extension Exemple — FR (FICTIF)"]
      - [produit_prix, "Prix public relu sur la fiche au moment de l'envoi (CHF, 2 décimales)", "209.90 (FICTIF)"]
      - [produit_limite, "« Limite : » suivi de la valeur validée de LIMITE_PAR_CLIENT (registre légal), ou vide", "Limite : 2 exemplaires par référence et par foyer"]
      - [produit_url, "URL de la fiche", "https://exemple.invalid/products/display-extension-exemple-fr"]
      - [url_preferences, "Page de préférences", "https://n8n.exemple.invalid/webhook/alertes-preferences?jeton=FICTIF"]
      - [url_desinscription, "Désinscription en un clic", "https://n8n.exemple.invalid/webhook/alertes-desinscrire?jeton=FICTIF"]
      - [date_consentement, "Date de confirmation", "14.10.2026"]
    blocs:
      - titre: "C'est en stock local"
      - p: "[[salutation]]"
      - p: "[[raison_alerte]]"
      - produit: {titre: "[[produit_titre]]", statut: stock_local, detail: "Expédié depuis Genève sous {{DELAI_EXPEDITION}}", prix: "[[produit_prix]]", limite: "[[produit_limite]]"}
      - bouton: {texte: "Voir la fiche", url: "[[produit_url]]"}
      - p: "Le prix et la disponibilité affichés sur le site au moment de votre commande font foi. Nous ne réservons pas de produit par email."

  - id: "05-recapitulatif-hebdo"
    nom: "Récapitulatif hebdomadaire"
    canal: n8n
    categorie: marketing
    motif_pied: alertes
    declencheur: "Jeudi (calendrier), seulement s'il y a un contenu utile ; sinon pas d'envoi"
    segment: "Inscrits confirmés ayant choisi le récapitulatif"
    base: "Consentement confirmé (récapitulatif au plus hebdomadaire)"
    frequence: "Au plus un par semaine (BP §9)"
    objet: "Cette semaine chez {{NOM_BOUTIQUE}} : [[titre_semaine]]"
    pre_entete: "[[pre_entete_semaine]]"
    variables:
      - [salutation, "Salutation calculée par le workflow", "Bonjour Léa,"]
      - [titre_semaine, "Titre court du récapitulatif", "ETB ou display, et ce qui est en stock"]
      - [pre_entete_semaine, "Une phrase factuelle", "Un guide et les produits réellement en stock cette semaine."]
      - [introduction, "Une ou deux phrases, sans urgence", "Cette semaine, un guide pour choisir entre ETB et display, et les produits en stock local."]
      - [lignes_produits_html, "Lignes produits (stock local ou précommande) ; bloc vide si rien", "(voir l'aperçu)"]
      - [guide_titre, "Titre du guide de la semaine", "ETB ou display : lequel choisir ?"]
      - [guide_resume, "Résumé en une phrase", "Deux formats, deux usages : on vous aide à choisir."]
      - [guide_url, "URL du guide", "https://exemple.invalid/blogs/guides/etb-ou-display"]
      - [url_preferences, "Page de préférences", "https://n8n.exemple.invalid/webhook/alertes-preferences?jeton=FICTIF"]
      - [url_desinscription, "Désinscription en un clic", "https://n8n.exemple.invalid/webhook/alertes-desinscrire?jeton=FICTIF"]
      - [date_consentement, "Date de confirmation", "14.10.2026"]
    blocs:
      - titre: "[[titre_semaine]]"
      - p: "[[salutation]]"
      - p: "[[introduction]]"
      - lignes_produits: {variable: lignes_produits_html}
      - sous_titre: "Le guide de la semaine : [[guide_titre]]"
      - p: "[[guide_resume]]"
      - bouton: {texte: "Lire le guide", url: "[[guide_url]]", style: secondaire}

  - id: "06-confirmation-commande"
    nom: "Confirmation de commande (notification Shopify)"
    canal: shopify
    categorie: transactionnel
    declencheur: "Commande payée (notification Shopify « Confirmation de commande »)"
    segment: "Le client de la commande"
    base: "Exécution du contrat ; aucun contenu promotionnel"
    frequence: "Une fois par commande"
    objet: "Commande [[order_name]] confirmée"
    pre_entete: "Récapitulatif, statut de chaque article et suite de votre commande."
    variables:
      - [order_name, "Numéro de commande (Liquid Shopify)", "#1001 (FICTIF)"]
      - [customer.first_name, "Prénom du client", "Léa"]
