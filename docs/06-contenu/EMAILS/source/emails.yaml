      - p: "[[salutation]]"
      - p: "Nous avons bien reçu votre paiement. Voici exactement ce que vous avez commandé."
      - commande_shopify: {}
      - bouton: {texte: "Voir ma commande", url: "[[order_status_url]]"}

  - id: "07-expedition-suivi"
    nom: "Expédition et suivi (notification Shopify)"
    canal: shopify
    categorie: transactionnel
    declencheur: "Envoi marqué expédié (notification Shopify « Confirmation d'expédition »)"
    segment: "Le client de la commande"
    base: "Exécution du contrat"
    frequence: "Une fois par envoi (une commande mixte = deux envois)"
    objet: "Commande [[order_name]] expédiée"
    pre_entete: "Votre numéro de suivi et le contenu de ce colis."
    variables:
      - [order_name, "Numéro de commande", "#1001 (FICTIF)"]
      - [customer.first_name, "Prénom du client", "Léa"]
      - [fulfillment.fulfillment_line_items, "Articles de cet envoi (line.line_item.title, line.quantity)", "(voir l'aperçu)"]
      - [fulfillment.tracking_numbers, "Numéros de suivi", "99.00.000000.00000000 (FICTIF)"]
      - [fulfillment.tracking_urls, "Liens de suivi", "https://exemple.invalid/suivi-fictif"]
      - [fulfillment.tracking_company, "Transporteur", "Transporteur (FICTIF)"]
      - [order_status_url, "Page de suivi de la commande", "https://exemple.invalid/commande-fictive"]
    blocs:
      - titre: "Votre colis est parti"
      - p: "[[salutation]]"
      - p: "Votre colis a été remis au transporteur. Voici ce qu'il contient :"
      - suivi_shopify: {}
      - p: "Le suivi peut mettre quelques heures à s'activer. S'il ne bouge plus depuis {{SEUIL_COLIS_BLOQUE}}, écrivez-nous : nous ouvrons une recherche."
      - p: "Colis abîmé à la livraison ? Photographiez le colis et les articles, puis écrivez-nous dans un délai de {{DELAI_SIGNALEMENT}}."
      - bouton: {texte: "Voir ma commande", url: "[[order_status_url]]", style: secondaire}

  - id: "08-precommande-confirmee"
    nom: "Précommande confirmée"
    canal: n8n
    categorie: transactionnel
    declencheur: "Commande payée contenant une ligne de précommande (en plus de la confirmation de commande)"
    segment: "Le client de la commande"
    base: "Exécution du contrat (information sur la précommande)"
    frequence: "Une fois par ligne de précommande"
    objet: "Précommande enregistrée : [[produit_titre]]"
    pre_entete: "Date de sortie, expédition, et ce qui se passe si la date change."
    variables:
      - [salutation, "Salutation calculée par le workflow", "Bonjour Léa,"]
      - [numero_commande, "Numéro de commande", "#1001 (FICTIF)"]
      - [produit_titre, "Titre exact de la fiche", "Coffret — Extension Exemple 2 — FR (FICTIF)"]
      - [date_sortie_libelle, "« le 6.11.2026 (date confirmée) », « estimée au 6.11.2026 (peut changer) » ou « non confirmée »", "estimée au 6.11.2026 (peut changer)"]
      - [url_commande, "Page de suivi de la commande", "https://exemple.invalid/commande-fictive"]
    blocs:
      - titre: "Votre précommande est enregistrée"
      - p: "[[salutation]]"
      - p: "Votre précommande fait partie de la commande [[numero_commande]] ; le paiement est reçu."
      - produit: {titre: "[[produit_titre]]", statut: precommande, detail: "Sortie [[date_sortie_libelle]]"}
      - liste:
          - "Le prix payé est définitif."
          - "Nous expédions dès réception et contrôle du produit, en principe sous {{DELAI_EXPEDITION}} après réception. Nous ne garantissons pas une livraison le jour de la sortie."
          - "Si la date change, nous vous écrivons dans un délai de {{DELAI_INFORMATION_REPORT}}."
          - "Annulation gratuite {{DELAI_ANNULATION_PRECOMMANDE}} : répondez à cet email avec votre numéro de commande."
      - p: "Si votre commande contient aussi des articles en stock local, ils partent dès qu'ils sont prêts ; la précommande suit séparément. La livraison n'est facturée qu'une fois."
      - bouton: {texte: "Nos conditions de précommande", url: "{{URL_PRECOMMANDES}}", style: secondaire}

