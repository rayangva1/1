          - "**Remboursement intégral** : CHF [[montant_rembourse]], sur votre [[moyen_paiement]], dans un délai de {{DELAI_REMBOURSEMENT}}. Le crédit sur votre compte dépend ensuite de votre banque."
      - p: "Les autres articles éventuels de votre commande ne sont pas concernés."
      - p: "Si vous le souhaitez, nous pouvons vous prévenir quand ce produit arrive en stock local :"
      - bouton: {texte: "Demander une alerte", url: "[[url_alerte_produit]]", style: secondaire}

