      - [subtotal_price, "Sous-total", "289.60 (FICTIF)"]
      - [shipping_price, "Frais de livraison facturés", "9.00 (FICTIF)"]
      - [total_price, "Total payé", "298.60 (FICTIF)"]
      - [shipping_address, "Adresse de livraison (name, address1, zip, city)", "Léa Exemple, Rue Fictive 1, 1200 Genève"]
