      - liste:
          - "Pour réserver pendant l'accès prioritaire, connectez-vous à votre compte client avec l'adresse de cet email ; votre compte doit accepter nos emails (consentement confirmé)."
          - "Le prix de la réservation garantie et le prix du drop sont affichés côte à côte sur la fiche ; le prix affiché au moment de votre commande fait foi."
          - "La limite par foyer, toutes commandes confondues, figure sur la fiche."
      - encadre:
          - "Le supplément pré-drop paie la garantie d'être servi en premier et expédié dès réception du stock, pas le produit."
          - "Aucun remboursement de la différence avec le prix du drop, même s'il reste des unités au drop."
      - p: "Rien ne presse : vous pouvez aussi attendre le drop et acheter au prix du drop, s'il reste des unités. Nous n'affichons ni minuteur ni nombre d'unités restantes."
      - bouton: {texte: "Voir la réservation garantie", url: "{{URL_SITE}}[[url_reservation]]"}

