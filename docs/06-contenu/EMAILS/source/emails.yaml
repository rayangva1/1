  # ------------------------------------------------------------------ pré-drop (réservation garantie)
  - id: "15-pre-drop-reservation-confirmee"
    nom: "Pré-drop : réservation garantie confirmée"
    canal: n8n
    categorie: transactionnel
    declencheur: "Réservation pré-drop payée et confirmée par le moteur (POST /predrop/reservations : CONFIRMED, nouvellement enregistrée), en plus de la confirmation de commande Shopify (06)"
    segment: "Le client de la commande"
    base: "Exécution du contrat (PRECOMMANDES : réservation garantie)"
    frequence: "Une fois par réservation ; rejeu du webhook : aucun envoi"
    objet: "Réservation garantie confirmée : [[produit_titre]]"
    pre_entete: "Servi en premier, expédié dès réception : ce que garantit votre réservation."
    variables:
      - [salutation, "Salutation calculée par le workflow ou l'outil d'emailing", "Bonjour Léa,"]
      - [numero_commande, "Numéro de commande (lu par l'outil d'emailing depuis la commande Shopify)", "#1001 (FICTIF)"]
      - [produit_titre, "Titre exact de la fiche de réservation (lu depuis la commande)", "Réservation garantie — Display 36 boosters — Extension Exemple — FR (FICTIF)"]
      - [date_drop, "Date du drop du moteur (jj.mm.aaaa), envoyée par le workflow 02", "20.10.2026"]
      - [url_commande, "Page de suivi de la commande", "https://exemple.invalid/commande-fictive"]
    blocs:
      - titre: "Votre réservation garantie est confirmée"
      - p: "[[salutation]]"
      - p: "Votre réservation fait partie de la commande [[numero_commande]] ; le paiement est reçu."
      - produit: {titre: "[[produit_titre]]", statut: reservation, detail: "Drop le [[date_drop]] (date estimée)"}
      - sous_titre: "Ce que garantit votre réservation"
      - liste:
          - "Vous êtes servi en premier : les réservations garanties passent avant toute vente au prix du drop, dans l'ordre de leur paiement."
          - "Votre commande est expédiée dès réception et contrôle du produit, en principe sous {{DELAI_EXPEDITION}} après réception. Nous ne garantissons pas une livraison le jour du drop."
          - "Le prix payé est définitif : il ne baisse pas et n'augmente pas."
      - encadre:
          - "Le supplément pré-drop paie la garantie d'être servi en premier et expédié dès réception du stock, pas le produit."
          - "Aucun remboursement de la différence avec le prix du drop, même s'il reste des unités au drop."
      - sous_titre: "Si quelque chose change"
      - liste:
          - "Si nous recevons moins d'unités que prévu et ne pouvons pas vous servir, nous vous remboursons intégralement, supplément compris, frais de livraison payés pour la réservation inclus, et nous vous prévenons par email."
          - "Si la date change, nous vous écrivons dans un délai de {{DELAI_INFORMATION_REPORT}} et la date de la fiche est mise à jour. Si le report dépasse {{SEUIL_REPORT_PRECOMMANDE}}, vous pouvez annuler et être remboursé intégralement, supplément compris."
          - "Annulation gratuite {{DELAI_ANNULATION_PREDROP}} (date affichée sur la fiche) : répondez à cet email avec votre numéro de commande. Remboursement intégral, supplément compris, frais de livraison payés pour la réservation inclus."
      - bouton: {texte: "Voir ma commande", url: "[[url_commande]]"}
      - bouton: {texte: "Nos conditions de réservation garantie", url: "{{URL_PRECOMMANDES}}", style: secondaire}

  - id: "16-pre-drop-acces-prioritaire"
