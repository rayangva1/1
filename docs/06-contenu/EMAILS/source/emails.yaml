    canal: n8n
    categorie: transactionnel
    declencheur: "Allocation réduite ou annulée : précommande non servie (ordre de paiement)"
    segment: "Clients dont la précommande ne peut pas être servie"
    base: "Exécution du contrat (PRECOMMANDES : remboursement intégral)"
    frequence: "Une fois"
    objet: "Précommande annulée et remboursée : [[produit_titre]]"
    pre_entete: "Nous ne pouvons pas servir votre précommande : remboursement intégral."
    variables:
      - [salutation, "Salutation calculée par le workflow", "Bonjour Léa,"]
      - [numero_commande, "Numéro de commande", "#1001 (FICTIF)"]
      - [produit_titre, "Titre exact de la fiche", "Coffret — Extension Exemple 2 — FR (FICTIF)"]
      - [montant_rembourse, "Montant remboursé (CHF, 2 décimales), lu dans le remboursement Shopify", "59.90 (FICTIF)"]
      - [moyen_paiement, "Moyen de paiement utilisé", "carte de paiement"]
      - [url_alerte_produit, "Formulaire d'alerte de la fiche (consentement demandé)", "https://exemple.invalid/products/coffret-extension-exemple-2-fr#alerte"]
    blocs:
      - titre: "Votre précommande ne peut pas être servie"
      - p: "[[salutation]]"
      - p: "La quantité qui nous a été attribuée pour [[produit_titre]] a été réduite ou annulée. Les précommandes sont servies dans l'ordre de leur paiement ; la vôtre (commande [[numero_commande]]) ne peut pas l'être. Nous en sommes désolés."
