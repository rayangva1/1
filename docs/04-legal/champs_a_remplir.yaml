  TAUX_HORAIRE_VALORISATION:
    description: "Taux horaire de valorisation du temps de la propriétaire (second compte de résultat)"
    statut: a_remplir
    decideur: "Propriétaire"
    source: "BP §3 « valoriser le temps dans un second compte de résultat »"
