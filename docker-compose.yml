# Pile locale — {{NOM_BOUTIQUE}} : PostgreSQL 16 + migrations + n8n + API du moteur.
#
# Calendrier (INTERVENTIONS_HUMAINES.md) : la pile (db, db-migrate, db-backup, api, n8n) dès J8 (B27), en simulation,
# seul n8n étant exposé par le proxy HTTPS (webhook d'inscription, liens des emails) ; mise en service complète
# (workflows 01 à 08, webhooks Shopify, formulaires) à J26 (B23), avant le niveau 2 (C14).
# Préparation (exécutable telle quelle, voir README.md « Démarrage ») :
#   1. Fichier de variables HORS DU DÉPÔT, appartenant à TON compte (jamais de .env à la racine : docker compose le
#      lirait tout seul) :
#        sudo install -D -m 600 -o "$USER" .env.example /etc/pokeshop/api.env
#      puis y remplir DEPUIS LE COFFRE au minimum POSTGRES_PASSWORD, POKESHOP_DB_PASSWORD, N8N_ENCRYPTION_KEY,
#      POKESHOP_OWNER_TOKEN_SHA256 et les empreintes des jetons par rôle POKESHOP_ROLE_TOKEN_SHA256_<RÔLE> (au minimum
#      N8N_07_STOPLOSS, CONNECTEUR_TRESORERIE et FINANCE_PRICING : sans eux, aucune photo ni relevé de trésorerie, le
#      stop-loss n'est jamais évaluable) ; POKESHOP_API_TOKEN_SHA256 (jeton commun, lecture seule) est facultatif
#      (autre chemin : POKESHOP_ENV_FILE=…) ;
#   2. scripts/compose.sh config --quiet   (vérification sans rien lancer : refuse un .env dans le dépôt, un
#      fichier de variables dans le dépôt ou lisible par d'autres, et échoue tant qu'un secret obligatoire manque) ;
#   3. scripts/compose.sh up -d db db-migrate db-backup api n8n   (même commande à J8 et à J26 ; « up -d n8n » démarrerait de
#      toute façon api et la base, dont n8n dépend)
#   4. scripts/compose.sh ps   (db-backup « healthy » = restauration vérifiée depuis moins de 36 h, db/backup.sh etat)
# scripts/compose.sh = docker compose --env-file /etc/pokeshop/api.env (interpolation seulement). La CLI lit --env-file
# avec l'identité de l'appelant : fichier à ton nom (-o "$USER"), ton compte membre du groupe docker (sudo usermod -aG
# docker "$USER", puis reconnexion), sinon « sudo scripts/compose.sh … ». Le compléter en place (nano), pas « sed -i ».
# Ports publiés sur la boucle locale de l'hôte seulement (127.0.0.1 : aucune exposition réseau) ; ils restent joignables
# par TOUT processus de l'hôte (dont une flotte d'agents qui y tournerait), en plus des services du compose. Chaque
# webhook de n8n est donc authentifié : passerelles des agents (un secret par webhook) et notifications du moteur
# vers 04 (POKESHOP_N8N_WEBHOOK_SECRET, revue R6) ; seuls les liens des emails (jeton unique, GET) ne le sont pas.
# Simulation par défaut : POKESHOP_DRY_RUN=true ; aucune écriture Shopify réelle sans POKESHOP_DRY_RUN=false
# ET le niveau d'autonomie requis. Autorisations par route : docs/08-agents/MATRICE_API.md (engine/pokeshop/authz.py).
#
# Moindre privilège : AUCUN service ne charge le fichier de variables en entier. Docker Compose le lit pour
# l'interpolation ${…} ; chaque service ne reçoit que les variables listées dans son bloc `environment` :
#   - db, db-migrate, db-backup : mot de passe administrateur PostgreSQL (db-migrate : aussi celui du compte du
#     moteur, pour le créer) ;
#   - api : variables POKESHOP_* seulement, connexion avec le compte `api_moteur` (membre de pokeshop_engine,
#     jamais l'administrateur) ; ni N8N_ENCRYPTION_KEY ni POSTGRES_PASSWORD ;
#   - n8n : sa clé de chiffrement et ses réglages ; aucun jeton ni mot de passe du moteur (le secret des notifications
#     du moteur vit dans un credential n8n chiffré, jamais dans l'environnement de n8n).

name: pokeshop

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pokeshop
      POSTGRES_USER: pokeshop_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD dans /etc/pokeshop/api.env (coffre)}
      TZ: Europe/Zurich
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokeshop_admin -d pokeshop"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Applique db/migrations/NNN_*.sql dans l'ordre (db/apply.sh, migrations seules, sans seed FICTIF),
  # puis crée ou met à jour le compte de connexion du moteur `api_moteur` (membre de pokeshop_engine).
  db-migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pokeshop_admin:${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD}@db:5432/pokeshop
      POKESHOP_DB_USER: api_moteur
      POKESHOP_DB_PASSWORD: ${POKESHOP_DB_PASSWORD:?definir POKESHOP_DB_PASSWORD dans /etc/pokeshop/api.env (coffre)}
    volumes:
      - ./db:/db:ro
    entrypoint: ["bash", "-c", "bash /db/apply.sh none && bash /db/engine_login.sh"]
    restart: "no"

  # Sauvegarde quotidienne (pg_dump) ET test de restauration dans une base jetable (db/backup.sh) :
  # une sauvegarde dont la restauration échoue est signalée dans le journal du service (BP §6).
  # Healthcheck = db/backup.sh etat : « unhealthy » tant qu'aucune restauration n'a été vérifiée depuis
  # moins de 36 h (contrôle de recette R-I04, bloquant). Copier régulièrement le volume « backups » hors de
  # la machine (disque chiffré de la propriétaire).
  db-backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://pokeshop_admin:${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD}@db:5432/pokeshop
      POKESHOP_BACKUP_DIR: /sauvegardes
      POKESHOP_BACKUP_KEEP: ${POKESHOP_BACKUP_KEEP:-30}
      POKESHOP_BACKUP_INTERVAL_HOURS: ${POKESHOP_BACKUP_INTERVAL_HOURS:-24}
      POKESHOP_BACKUP_MAX_AGE_HOURS: ${POKESHOP_BACKUP_MAX_AGE_HOURS:-36}
      TZ: Europe/Zurich
    volumes:
      - ./db:/db:ro
      - backups:/sauvegardes
    entrypoint: ["bash", "/db/backup.sh", "boucle"]
    healthcheck:
      test: ["CMD", "bash", "/db/backup.sh", "etat"]
      interval: 1h
      timeout: 30s
      retries: 1
      start_period: 2h

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    # Pas d'env_file : liste explicite (moindre privilège). Valeur vide = absente pour le moteur.
    environment:
      POKESHOP_ENV: ${POKESHOP_ENV:-dev}
      POKESHOP_DRY_RUN: ${POKESHOP_DRY_RUN:-true}
      POKESHOP_VAT_PROFILE: ${POKESHOP_VAT_PROFILE:-EFFECTIVE}
      POKESHOP_TIMEZONE: ${POKESHOP_TIMEZONE:-Europe/Zurich}
      POKESHOP_RULES_PATH: ${POKESHOP_RULES_PATH:-}
      POKESHOP_STOPLOSS_PATH: ${POKESHOP_STOPLOSS_PATH:-}
      POKESHOP_MANDATE_PATH: ${POKESHOP_MANDATE_PATH:-}
      POKESHOP_PREDROP_PATH: ${POKESHOP_PREDROP_PATH:-}
      POKESHOP_MANDATE_FINGERPRINT: ${POKESHOP_MANDATE_FINGERPRINT:-}
      POKESHOP_STOPLOSS_FINGERPRINT: ${POKESHOP_STOPLOSS_FINGERPRINT:-}
      POKESHOP_RULES_FINGERPRINT: ${POKESHOP_RULES_FINGERPRINT:-}
      POKESHOP_PREDROP_FINGERPRINT: ${POKESHOP_PREDROP_FINGERPRINT:-}
      # Jeton commun : lecture et aperçus seulement (facultatif ; tableau de bord dashboard/build.py).
      POKESHOP_API_TOKEN_SHA256: ${POKESHOP_API_TOKEN_SHA256:-}
      POKESHOP_OWNER_TOKEN_SHA256: ${POKESHOP_OWNER_TOKEN_SHA256:?definir POKESHOP_OWNER_TOKEN_SHA256 dans /etc/pokeshop/api.env (coffre)}
      POKESHOP_AGENT_TOKENS_SHA256: ${POKESHOP_AGENT_TOKENS_SHA256:-}
      # Un jeton nommé par rôle (matrice docs/08-agents/MATRICE_API.md) : empreinte sha256, jamais le jeton.
      POKESHOP_ROLE_TOKEN_SHA256_ACQUISITION: ${POKESHOP_ROLE_TOKEN_SHA256_ACQUISITION:-}
      POKESHOP_ROLE_TOKEN_SHA256_CATALOGUE: ${POKESHOP_ROLE_TOKEN_SHA256_CATALOGUE:-}
      POKESHOP_ROLE_TOKEN_SHA256_CHEF_DE_PROJET: ${POKESHOP_ROLE_TOKEN_SHA256_CHEF_DE_PROJET:-}
      POKESHOP_ROLE_TOKEN_SHA256_COMMUNICATION: ${POKESHOP_ROLE_TOKEN_SHA256_COMMUNICATION:-}
      POKESHOP_ROLE_TOKEN_SHA256_CONNECTEUR_PUBLICITE: ${POKESHOP_ROLE_TOKEN_SHA256_CONNECTEUR_PUBLICITE:-}
      POKESHOP_ROLE_TOKEN_SHA256_CONNECTEUR_TRESORERIE: ${POKESHOP_ROLE_TOKEN_SHA256_CONNECTEUR_TRESORERIE:?definir POKESHOP_ROLE_TOKEN_SHA256_CONNECTEUR_TRESORERIE dans /etc/pokeshop/api.env (sinon stop-loss jamais evaluable)}
      POKESHOP_ROLE_TOKEN_SHA256_DIRECTION_ARTISTIQUE: ${POKESHOP_ROLE_TOKEN_SHA256_DIRECTION_ARTISTIQUE:-}
      POKESHOP_ROLE_TOKEN_SHA256_DONNEES_FOURNISSEURS: ${POKESHOP_ROLE_TOKEN_SHA256_DONNEES_FOURNISSEURS:-}
      POKESHOP_ROLE_TOKEN_SHA256_FINANCE_PRICING: ${POKESHOP_ROLE_TOKEN_SHA256_FINANCE_PRICING:?definir POKESHOP_ROLE_TOKEN_SHA256_FINANCE_PRICING dans /etc/pokeshop/api.env (sinon stop-loss jamais evaluable)}
      POKESHOP_ROLE_TOKEN_SHA256_N8N_01_SYNC: ${POKESHOP_ROLE_TOKEN_SHA256_N8N_01_SYNC:-}
      POKESHOP_ROLE_TOKEN_SHA256_N8N_02_COMMANDES: ${POKESHOP_ROLE_TOKEN_SHA256_N8N_02_COMMANDES:-}
      POKESHOP_ROLE_TOKEN_SHA256_N8N_03_FACTURES: ${POKESHOP_ROLE_TOKEN_SHA256_N8N_03_FACTURES:-}
      POKESHOP_ROLE_TOKEN_SHA256_N8N_04_INCIDENTS: ${POKESHOP_ROLE_TOKEN_SHA256_N8N_04_INCIDENTS:-}
      POKESHOP_ROLE_TOKEN_SHA256_N8N_05_DIGEST: ${POKESHOP_ROLE_TOKEN_SHA256_N8N_05_DIGEST:-}
      POKESHOP_ROLE_TOKEN_SHA256_N8N_06_MARKETING: ${POKESHOP_ROLE_TOKEN_SHA256_N8N_06_MARKETING:-}
      POKESHOP_ROLE_TOKEN_SHA256_N8N_07_STOPLOSS: ${POKESHOP_ROLE_TOKEN_SHA256_N8N_07_STOPLOSS:?definir POKESHOP_ROLE_TOKEN_SHA256_N8N_07_STOPLOSS dans /etc/pokeshop/api.env (sinon stop-loss jamais evaluable)}
      POKESHOP_ROLE_TOKEN_SHA256_N8N_08_MANDAT: ${POKESHOP_ROLE_TOKEN_SHA256_N8N_08_MANDAT:-}
      POKESHOP_ROLE_TOKEN_SHA256_OPERATIONS_SAV: ${POKESHOP_ROLE_TOKEN_SHA256_OPERATIONS_SAV:-}
      POKESHOP_ROLE_TOKEN_SHA256_QA_CONFORMITE: ${POKESHOP_ROLE_TOKEN_SHA256_QA_CONFORMITE:-}
      POKESHOP_ROLE_TOKEN_SHA256_SEO_REDACTION: ${POKESHOP_ROLE_TOKEN_SHA256_SEO_REDACTION:-}
      POKESHOP_ROLE_TOKEN_SHA256_SITE_INTEGRATIONS: ${POKESHOP_ROLE_TOKEN_SHA256_SITE_INTEGRATIONS:-}
      POKESHOP_ROLE_TOKEN_SHA256_SOURCING: ${POKESHOP_ROLE_TOKEN_SHA256_SOURCING:-}
      POKESHOP_SHOPIFY_SHOP_DOMAIN: ${POKESHOP_SHOPIFY_SHOP_DOMAIN:-}
      POKESHOP_SHOPIFY_API_VERSION: ${POKESHOP_SHOPIFY_API_VERSION:-2026-10}
      POKESHOP_SHOPIFY_ADMIN_TOKEN: ${POKESHOP_SHOPIFY_ADMIN_TOKEN:-}
      POKESHOP_SHOPIFY_LOCATION_ID: ${POKESHOP_SHOPIFY_LOCATION_ID:-}
      POKESHOP_SHOPIFY_TEST_STORE: ${POKESHOP_SHOPIFY_TEST_STORE:-false}
      # Compte de connexion du moteur créé par db-migrate (db/engine_login.sh), jamais l'administrateur.
      POKESHOP_DATABASE_URL: postgresql://api_moteur:${POKESHOP_DB_PASSWORD:?definir POKESHOP_DB_PASSWORD}@db:5432/pokeshop
      POKESHOP_N8N_WEBHOOK_URL: http://n8n:5678/webhook/pokeshop-incidents
      # Secret dédié des notifications (en-tête X-Pokeshop-Notify, vérifié par le credential n8n « Notification moteur
      # → 04 ») : vide = aucune notification réelle (signalé par /health et le digest 05). Revue R6 (R5C-DOC-07).
      POKESHOP_N8N_WEBHOOK_SECRET: ${POKESHOP_N8N_WEBHOOK_SECRET:-}
      # false par défaut : les incidents partent vers le workflow 04 (n8n interne) ; un envoi raté est journalisé
      # « non livré ». true = alertes simulées (signalé par /health et le digest 05).
      POKESHOP_NOTIFY_DRY_RUN: ${POKESHOP_NOTIFY_DRY_RUN:-false}
      POKESHOP_AUTONOMY_LEVEL: ${POKESHOP_AUTONOMY_LEVEL:-1}
      # Vide = data/samples (jeux FICTIFS de l'image). Flux réel : /data/imports (volume partagé avec n8n).
      POKESHOP_IMPORTS_DIR: ${POKESHOP_IMPORTS_DIR:-}
      TZ: Europe/Zurich
    volumes:
      - imports:/data/imports:ro
    ports:
      - "127.0.0.1:8000:8000"

  n8n:
    # Épingler une version testée avant toute mise en service (tag non vérifiable depuis l'environnement de build).
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?definir N8N_ENCRYPTION_KEY dans /etc/pokeshop/api.env (coffre)}
      # URL publique HTTPS de n8n (webhooks Shopify, liens des emails, formulaires) ; vide = localhost.
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      # Seul dossier lisible/inscriptible par les nœuds fichiers (dépôt du flux fournisseur du workflow 01).
      N8N_RESTRICT_FILE_ACCESS_TO: /data/imports
      GENERIC_TIMEZONE: Europe/Zurich
      TZ: Europe/Zurich
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PORT: "5678"
      # Revue R6 (R5C-DOC-05) : une exécution conservée garde les en-têtes reçus (secrets de passerelle, secret du
      # moteur) en clair dans le volume n8n-data. Les workflows à webhook authentifié (03, 04, 06, 08) ne conservent
      # jamais une exécution réussie ; les exécutions en échec (diagnostic) sont purgées après 7 jours (168 h), une
      # exécution en attente d'un formulaire n'est jamais purgée. Purge, rotation : orchestration/README.md §2.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./orchestration/n8n:/workflows:ro
      - imports:/data/imports
    ports:
      - "127.0.0.1:5678:5678"

volumes:
  db-data:
  n8n-data:
  # Dossier d'import partagé : n8n y dépose le flux autorisé, l'API le lit (lecture seule).
  imports:
  # Sauvegardes de la base (contiennent coûts et marges : jamais dans le dépôt ni sur un partage ouvert).
  backups:
