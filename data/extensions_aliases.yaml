# Table d'alias des extensions JCC Pokémon (FR) — {{NOM_BOUTIQUE}}
# Propriété : agent data-pipeline. Chargée par engine/pokeshop/catalog.py
# (load_extension_table, normalize_extension). Variable d'environnement :
# POKESHOP_EXTENSIONS_PATH (plusieurs fichiers séparés par « : » pour fusionner).
#
# RÈGLES
# - Aucune extension inventée : chaque entrée réelle cite au moins une source datée.
#   Les sources viennent de docs/01-marche/ASSORTIMENT_PILOTE.md (agent marché) et
#   d'une recherche web de contrôle faite le 4.10.2026 par l'agent data-pipeline.
# - Une extension absente de cette table => extension inconnue => fiche en BROUILLON
#   (BP §5). On ajoute l'alias après vérification, on ne devine jamais.
# - Le préfixe de série « Méga-Évolution » seul NE désigne PAS une extension précise
#   (c'est aussi le nom de la première extension du bloc, non listée ici faute de
#   vérification) : il n'est donc jamais un alias.
# - Les codes « officiel: false » sont des codes INTERNES (pas de code public vérifié).
# - Les entrées FICTIVES des jeux d'essai vivent dans
#   data/samples/FICTIF_extensions_aliases.yaml, jamais ici.
# - Les alias sont comparés après normalisation (minuscules, sans accents, ponctuation
#   remplacée par des espaces) : « Nuit-Noire », « nuit noire », « NUIT NOIRE » = même alias.

